<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Frog Hop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#102015;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center;padding:8px}main{width:min(760px,100%);text-align:center}canvas{display:block;width:100%;aspect-ratio:1/1;background:#183a22;border:3px solid #d8ffd8;border-radius:12px;touch-action:none}.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:9px}button,select{min-height:44px;border-radius:9px;border:1px solid #b7d8b7;background:#18301d;color:white;padding:7px 12px;font-size:16px;font-weight:700}.pad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:58px 58px;justify-content:center;gap:5px;touch-action:none}.pad button{font-size:28px;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.small{color:#b8d1b8;font-size:13px}</style></head><body><main><canvas id="g" width="720" height="720"></canvas><div class="bar"><button id="start">Start / Restart</button><select id="difficulty"><option value="0.65">Kid</option><option value="1" selected>Normal</option><option value="1.35">Fast</option></select><span id="status">Get the frog home!</span></div><div class="pad"><button class="up" data-d="u">▲</button><button class="left" data-d="l">◀</button><button class="down" data-d="d">▼</button><button class="right" data-d="r">▶</button></div><div class="small">Tap arrows or swipe the game. Cross the road, ride the logs, reach the lily pads.</div></main><script>(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),status=document.getElementById('status'),diff=document.getElementById('difficulty');const W=720,H=720,C=72;let frog,score,lives,running,last=performance.now(),startTouch=null;const lanes=[{y:576,type:'road',dir:1,s:90,items:[[0,100],[300,115],[590,95]]},{y:504,type:'road',dir:-1,s:125,items:[[90,110],[410,100],[650,105]]},{y:432,type:'road',dir:1,s:155,items:[[10,90],[270,90],[530,90]]},{y:288,type:'water',dir:-1,s:75,items:[[0,190],[290,175],[570,190]]},{y:216,type:'water',dir:1,s:105,items:[[40,165],[300,185],[600,165]]},{y:144,type:'water',dir:-1,s:135,items:[[0,150],[240,190],[520,170]]}];function resetFrog(){frog={x:W/2-C/2,y:H-C}}function reset(){score=0;lives=3;running=true;resetFrog();status.textContent='Lives: 3  •  Score: 0'}function move(d){if(!running)return;if(d==='u')frog.y-=C;if(d==='d')frog.y+=C;if(d==='l')frog.x-=C;if(d==='r')frog.x+=C;frog.x=Math.max(0,Math.min(W-C,frog.x));frog.y=Math.max(0,Math.min(H-C,frog.y));if(frog.y===0){score++;status.textContent='Home! Score: '+score+' • Lives: '+lives;setTimeout(()=>{if(running)resetFrog()},250)}}document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.d)}));c.addEventListener('pointerdown',e=>{startTouch={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!startTouch)return;let dx=e.clientX-startTouch.x,dy=e.clientY-startTouch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));startTouch=null});addEventListener('keydown',e=>{let m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){e.preventDefault();move(m)}});document.getElementById('start').onclick=reset;function die(){lives--;if(lives<=0){running=false;status.textContent='Game over — Score: '+score}else{status.textContent='Oops! Lives: '+lives+' • Score: '+score;resetFrog()}}function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function update(dt){if(!running)return;let mult=Number(diff.value),sec=Math.min(dt,.05);for(const lane of lanes){for(const it of lane.items){it[0]+=lane.dir*lane.s*mult*sec;if(lane.dir>0&&it[0]>W+30)it[0]=-it[1]-30;if(lane.dir<0&&it[0]+it[1]<-30)it[0]=W+30}}const cy=frog.y;let lane=lanes.find(q=>q.y===cy);if(lane){if(lane.type==='road'){if(lane.items.some(it=>overlaps(frog,{x:it[0],y:lane.y+10,w:it[1],h:52})))die()}else{let log=lane.items.find(it=>overlaps(frog,{x:it[0],y:lane.y+9,w:it[1],h:54}));if(!log)die();else{frog.x+=lane.dir*lane.s*mult*sec;if(frog.x<0||frog.x>W-C)die()}}}}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#397b3c';x.fillRect(0,0,W,72);x.fillRect(0,360,W,72);x.fillRect(0,648,W,72);x.fillStyle='#245d9b';x.fillRect(0,72,W,288);x.fillStyle='#343434';x.fillRect(0,432,W,216);for(let y=432;y<648;y+=72){x.strokeStyle='#777';x.setLineDash([24,20]);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}x.setLineDash([]);x.fillStyle='#80d55b';for(let i=0;i<5;i++){x.beginPath();x.ellipse(72+i*144,35,42,22,0,0,Math.PI*2);x.fill()}for(const lane of lanes){for(const it of lane.items){if(lane.type==='road'){x.fillStyle=lane.dir>0?'#efc14b':'#e66555';x.fillRect(it[0],lane.y+12,it[1],48);x.fillStyle='#222';x.beginPath();x.arc(it[0]+22,lane.y+62,10,0,7);x.arc(it[0]+it[1]-22,lane.y+62,10,0,7);x.fill()}else{x.fillStyle='#8a572f';x.fillRect(it[0],lane.y+12,it[1],48);x.fillStyle='#b87943';for(let q=15;q<it[1];q+=42)x.fillRect(it[0]+q,lane.y+16,5,40)}}}x.fillStyle='#6ee05f';x.beginPath();x.ellipse(frog.x+C/2,frog.y+C/2,28,24,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(frog.x+23,frog.y+23,8,0,7);x.arc(frog.x+49,frog.y+23,8,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(frog.x+23,frog.y+23,4,0,7);x.arc(frog.x+49,frog.y+23,4,0,7);x.fill();if(!running){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 48px Arial';x.textAlign='center';x.fillText('FROG HOP',W/2,H/2-15);x.font='25px Arial';x.fillText('Tap Start / Restart',W/2,H/2+35)}}function loop(t){let dt=(t-last)/1000;last=t;update(dt);draw();requestAnimationFrame(loop)}resetFrog();score=0;lives=3;running=false;requestAnimationFrame(loop)})();</script></body></html>
