<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Family Pong</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overscroll-behavior:none}body{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}#app{width:min(1180px,100%);text-align:center}#gameWrap{position:relative;width:100%;aspect-ratio:16/9;max-height:76vh;margin:auto;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;background:#000;border:2px solid #fff;border-radius:8px}#touchHint{position:absolute;left:0;right:0;bottom:12px;color:#777;font-size:clamp(12px,1.7vw,18px);pointer-events:none}.controls{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 2px 0}button,select{min-height:44px;background:#151515;color:#fff;border:1px solid #777;border-radius:8px;padding:8px 12px;font-size:16px}button{font-weight:700}button:active{background:#333}.label{font-size:13px;color:#aaa;margin-right:-3px}#status{min-width:100px;color:#bbb;font-size:14px}@media (orientation:portrait){#gameWrap{margin-top:6px}#touchHint::after{content:" • Landscape works best"}}
</style>
</head>
<body><main id="app"><div id="gameWrap" aria-label="Pong game. Drag on the left or right half to move that paddle."><canvas id="game" width="1280" height="720"></canvas><div id="touchHint">Drag anywhere on your side to move your paddle</div></div><div class="controls"><button id="start" type="button">Start / Restart</button><button id="pause" type="button">Pause</button><span class="label">Mode</span><select id="mode" aria-label="Game mode"><option value="cpu">1 Player vs Computer</option><option value="pvp">2 Players</option></select><span class="label">Ball</span><select id="speed" aria-label="Ball speed"><option value="0.58">Slow (Kid Mode)</option><option value="1" selected>Normal</option><option value="1.35">Fast</option></select><span id="status">First to 11</span></div></main>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const wrap=document.getElementById('gameWrap'),modeEl=document.getElementById('mode'),speedEl=document.getElementById('speed');const startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause'),statusEl=document.getElementById('status');const W=1280,H=720,pad={w:18,h:126,speed:10};let left,right,ball,score=[0,0],running=false,paused=false,serveTimer=0,last=performance.now();const keys={},touches=new Map();function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function scale(){return Number(speedEl.value)||1}function resetPaddles(){left={x:38,y:H/2-pad.h/2,vy:0};right={x:W-38-pad.w,y:H/2-pad.h/2,vy:0}}function newBall(dir){ball={x:W/2,y:H/2,r:12,vx:0,vy:0,nextVx:dir*(6.4+Math.random()*1.1)*scale(),nextVy:(Math.random()*4.6-2.3)*scale()};serveTimer=55}function reset(){resetPaddles();score=[0,0];running=true;paused=false;pauseBtn.textContent='Pause';statusEl.textContent='First to 11';newBall(Math.random()<.5?-1:1)}function gamePoint(side){score[side]++;if(score[side]>=11){running=false;statusEl.textContent=(side===0?'Left':'Right')+' wins!';return}newBall(side===0?-1:1)}function touchY(clientY){const r=canvas.getBoundingClientRect();return clamp((clientY-r.top)/r.height*H-pad.h/2,0,H-pad.h)}function applyTouch(clientX,clientY,id){const r=canvas.getBoundingClientRect(),gx=(clientX-r.left)/r.width*W;const side=gx<W/2?'left':'right';touches.set(id,side);if(side==='left')left.y=touchY(clientY);else if(modeEl.value==='pvp')right.y=touchY(clientY)}wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture?.(e.pointerId);applyTouch(e.clientX,e.clientY,e.pointerId);e.preventDefault()});wrap.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const side=touches.get(e.pointerId);if(side==='left')left.y=touchY(e.clientY);else if(modeEl.value==='pvp')right.y=touchY(e.clientY);e.preventDefault()});['pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,e=>touches.delete(e.pointerId)));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();togglePause()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function togglePause(){if(!running)return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}startBtn.addEventListener('click',reset);pauseBtn.addEventListener('click',togglePause);function update(dt){if(!running||paused)return;const step=Math.min(1.7,dt/16.667);if(keys.w)left.y-=pad.speed*step;if(keys.s)left.y+=pad.speed*step;left.y=clamp(left.y,0,H-pad.h);if(modeEl.value==='pvp'){if(keys.arrowup)right.y-=pad.speed*step;if(keys.arrowdown)right.y+=pad.speed*step}else{const target=ball.y-pad.h/2,error=target-right.y;right.y+=clamp(error*.075,-6.7,6.7)*step}right.y=clamp(right.y,0,H-pad.h);if(serveTimer>0){serveTimer-=step;if(serveTimer<=0){ball.vx=ball.nextVx;ball.vy=ball.nextVy}return}ball.x+=ball.vx*step;ball.y+=ball.vy*step;if(ball.y-ball.r<=0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.y+ball.r>=H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)}function hit(p,isLeft){const yOK=ball.y+ball.r>=p.y&&ball.y-ball.r<=p.y+pad.h;const xOK=isLeft?ball.x-ball.r<=p.x+pad.w&&ball.x>p.x:ball.x+ball.r>=p.x&&ball.x<p.x+pad.w;if(yOK&&xOK&&((isLeft&&ball.vx<0)||(!isLeft&&ball.vx>0))){const rel=clamp((ball.y-(p.y+pad.h/2))/(pad.h/2),-.95,.95);const sp=Math.min(14*scale(),Math.max(5*scale(),Math.hypot(ball.vx,ball.vy)*1.045));ball.vx=(isLeft?1:-1)*sp*Math.cos(rel*.82);ball.vy=sp*Math.sin(rel*.82);ball.x=isLeft?p.x+pad.w+ball.r:p.x-ball.r}}hit(left,true);hit(right,false);if(ball.x<-30)gamePoint(1);else if(ball.x>W+30)gamePoint(0)}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='82px Arial';ctx.textAlign='center';ctx.fillText(score[0],W*.43,92);ctx.fillText(score[1],W*.57,92);for(let y=10;y<H;y+=42)ctx.fillRect(W/2-3,y,6,23);ctx.fillRect(left.x,left.y,pad.w,pad.h);ctx.fillRect(right.x,right.y,pad.w,pad.h);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();if(!running){ctx.font='44px Arial';ctx.fillText(score[0]>=11?'LEFT PLAYER WINS':score[1]>=11?'RIGHT PLAYER WINS':'FAMILY PONG',W/2,H/2-22);ctx.font='25px Arial';ctx.fillText('Tap Start / Restart',W/2,H/2+28)}else if(paused){ctx.font='44px Arial';ctx.fillText('PAUSED',W/2,H/2)}}function loop(now){const dt=now-last;last=now;update(dt);draw();requestAnimationFrame(loop)}resetPaddles();newBall(1);running=false;requestAnimationFrame(loop)})();
</script></body></html>
