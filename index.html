<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#090b14"><title>Family Arcade</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#090b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.wrap{width:min(950px,100%);margin:auto;text-align:center}h1{font-size:clamp(42px,8vw,82px);margin:22px 0 0;letter-spacing:3px;text-shadow:0 4px 0 #31395d}.sub{color:#aeb5cf;font-size:clamp(16px,2.5vw,22px);margin:6px 0 28px}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.game{min-height:260px;border-radius:24px;text-decoration:none;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;border:3px solid rgba(255,255,255,.8);box-shadow:0 9px 0 rgba(0,0,0,.35);touch-action:manipulation}.game:active{transform:translateY(5px);box-shadow:0 4px 0 rgba(0,0,0,.35)}.pong{background:linear-gradient(145deg,#161616,#343434)}.frog{background:linear-gradient(145deg,#184c25,#2c833e)}.icon{font-size:clamp(70px,12vw,120px);line-height:1}.name{font-size:clamp(30px,5vw,50px);font-weight:900;letter-spacing:2px;margin-top:10px}.desc{font-size:clamp(14px,2vw,19px);color:rgba(255,255,255,.78);margin-top:5px}.footer{margin-top:28px;color:#6f7898;font-size:14px}.coming{margin-top:18px;border:2px dashed #39415d;border-radius:18px;padding:18px;color:#737c9c;font-weight:700}@media(max-width:620px){.games{grid-template-columns:1fr}.game{min-height:205px}}</style></head><body><main class="wrap"><
