<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Unicorn Sky</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#5d66d9;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center;padding:8px}main{width:min(1000px,100%);text-align:center}.home{color:#fff;text-decoration:none;font-weight:800;display:inline-block;padding:7px}canvas{display:block;width:100%;aspect-ratio:16/10;border:3px solid white;border-radius:16px;touch-action:none}.bar{display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap;padding:9px}button,select,input{min-height:44px;border:1px solid white;border-radius:9px;background:#6745b7;color:#fff;padding:7px 13px;font-size:16px;font-weight:800}input{background:#fff;color:#33265f;width:180px}.hint{font-size:13px;color:#e7e2ff}.modal{position:fixed;inset:0;background:rgba(32,24,78,.78);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.card{width:min(430px,94vw);background:#6b54c6;border:3px solid #fff;border-radius:20px;padding:22px;box-shadow:0 14px 45px rgba(0,0,0,.3)}.card h2{margin:0 0 12px;font-size:32px}.card input{width:100%;margin:8px 0 12px}.card button{width:100%;background:#49359a}.hidden{display:none}.leader{margin:10px 0;text-align:left;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 14px}.row{display:flex;justify-content:space-between;padding:5px 0;font-weight:800}.small{font-size:13px;color:#eee7ff}</style></head>
<body><main><a class="home" href="./">← Family Arcade</a><canvas id="g" width="960" height="600"></canvas><div class="bar"><button id="start">Start / Restart</button><button id="playerBtn">Player</button><button id="leaderBtn">Leaderboard</button><select id="difficulty"><option value="0.72">Kid</option><option value="1" selected>Normal</option><option value="1.3">Fast</option></select><span id="status">🌈 Fly through rainbows!</span></div><div class="hint">Touch and hold, or hold Space, to fly up. Let go to float down. Scores are saved on this device.</div></main>
<div id="nameModal" class="modal"><div class="card"><h2>Who's playing?</h2><div class="small">Enter a name. This device will remember your best score.</div><input id="nameInput" maxlength="18" autocomplete="off" placeholder="Player name"><button id="nameGo">Play Unicorn Sky</button></div></div>
<div id="leaderModal" class="modal hidden"><div class="card"><h2>🏆 Leaderboard</h2><div id="leaderList" class="leader"></div><button id="leaderClose">Back to Game</button></div></div>
<script>
(()=>{
const c=document.getElementById('g'),ctx=c.getContext('2d'),status=document.getElementById('status'),diff=document.getElementById('difficulty'),W=c.width,H=c.height;
const unicornSprite=new Image();unicornSprite.src='./unicorn-sprite.png';const STORE='unicornSkyScoresV1';let player='',u,obs,score,lives,running,pressed,last,spawn,inv;
function scores(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}}function best(name){return scores()[name]||0}function saveBest(){if(!player)return;const s=scores();if(score>(s[player]||0)){s[player]=score;localStorage.setItem(STORE,JSON.stringify(s))}}
function reset(){if(!player){showName();return}u={x:125,y:250,vy:0,w:155,h:118};obs=[];score=0;lives=3;running=true;pressed=false;spawn=.7;inv=0;updateStatus()}
function updateStatus(){status.textContent=(player?player+'  ':'')+(lives?'❤️'.repeat(lives):'💔')+'  Score: '+score+'  •  Best: '+best(player)}
function addObstacle(){const rainbow=Math.random()<.42;obs.push({type:rainbow?'rainbow':'cloud',x:W+100,y:65+Math.random()*(H-175),w:rainbow?90:130,h:rainbow?85:95,hit:false})}
function overlaps(a,b,p=0){return a.x+p<b.x+b.w&&a.x+a.w-p>b.x&&a.y+p<b.y+b.h&&a.y+a.h-p>b.y}
function update(dt){if(!running)return;const speed=+diff.value;inv=Math.max(0,inv-dt);u.vy+=(pressed?-720:510)*dt;u.vy=Math.max(-340,Math.min(340,u.vy));u.y+=u.vy*dt;if(u.y<8){u.y=8;u.vy=20}if(u.y+u.h>H-8){u.y=H-u.h-8;u.vy=-80}spawn-=dt;if(spawn<=0){addObstacle();spawn=(.95+Math.random()*.55)/speed}for(const o of obs){o.x-=235*speed*dt;const hb={x:u.x+32,y:u.y+22,w:u.w-56,h:u.h-40};if(!o.hit&&overlaps(hb,o,o.type==='cloud'?24:8)){o.hit=true;if(o.type==='rainbow'){score+=10;saveBest()}else if(inv<=0){lives--;inv=1.3;if(lives<=0){running=false;saveBest()}}updateStatus()}}obs=obs.filter(o=>o.x>-170)}
function cloud(o){ctx.save();ctx.translate(o.x,o.y);ctx.globalAlpha=o.hit?.25:1;const g=ctx.createLinearGradient(0,0,0,90);g.addColorStop(0,'#777995');g.addColorStop(1,'#3b3d58');ctx.fillStyle=g;ctx.beginPath();ctx.arc(30,50,27,0,Math.PI*2);ctx.arc(57,32,34,0,Math.PI*2);ctx.arc(88,30,40,0,Math.PI*2);ctx.arc(112,51,27,0,Math.PI*2);ctx.rect(30,45,82,33);ctx.fill();if(!o.hit){ctx.fillStyle='#ffd84c';ctx.beginPath();ctx.moveTo(62,57);ctx.lineTo(47,84);ctx.lineTo(64,82);ctx.lineTo(52,114);ctx.lineTo(84,75);ctx.lineTo(68,77);ctx.lineTo(79,57);ctx.closePath();ctx.fill();ctx.fillStyle='#65c8ff';[31,98,118].forEach((d,i)=>{ctx.beginPath();ctx.ellipse(d,92+(i%2)*8,4,10,-.2,0,Math.PI*2);ctx.fill()})}ctx.restore()}
function rainbow(o){if(o.hit)return;['#ff5e75','#ffb34f','#ffe65c','#63df79','#58baf2','#a97cf4'].forEach((color,i)=>{ctx.strokeStyle=color;ctx.lineWidth=8;ctx.beginPath();ctx.arc(o.x+45,o.y+61,44-i*6,Math.PI,Math.PI*2);ctx.stroke()})}
function unicorn(){ctx.save();if(inv&&Math.floor(inv*10)%2===0)ctx.globalAlpha=.3;ctx.translate(u.x+u.w/2,u.y+u.h/2);ctx.rotate(Math.max(-.16,Math.min(.16,u.vy/1200)));if(unicornSprite.complete&&unicornSprite.naturalWidth)ctx.drawImage(unicornSprite,-u.w/2,-u.h/2,u.w,u.h);else{ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='96px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.fillText('🦄',0,2)}ctx.restore()}
function draw(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5299f4');sky.addColorStop(.55,'#9a82e8');sky.addColorStop(1,'#f4a9d4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(const o of obs)o.type==='cloud'?cloud(o):rainbow(o);unicorn();ctx.fillStyle='rgba(40,30,90,.55)';ctx.fillRect(15,15,400,52);ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText((player?player+'  ':'')+(lives?'❤️'.repeat(lives):'💔')+'  '+score+'  BEST '+best(player),30,49);if(!running){ctx.fillStyle='rgba(39,27,91,.58)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 58px Arial';ctx.fillText(lives?'UNICORN SKY':'GAME OVER',W/2,H/2-20);ctx.font='25px Arial';ctx.fillText(player?(player+' — Score '+score+' • Best '+best(player)):'Choose a player',W/2,H/2+30)}}
function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
function showName(){running=false;document.getElementById('nameInput').value=player;document.getElementById('nameModal').classList.remove('hidden');setTimeout(()=>document.getElementById('nameInput').focus(),50)}function setName(){const n=document.getElementById('nameInput').value.trim().replace(/\s+/g,' ').slice(0,18);if(!n)return;player=n;localStorage.setItem('unicornSkyLastPlayer',player);document.getElementById('nameModal').classList.add('hidden');reset()}
function showLeader(){running=false;saveBest();const list=document.getElementById('leaderList'),entries=Object.entries(scores()).sort((a,b)=>b[1]-a[1]);list.innerHTML=entries.length?entries.map(([n,s],i)=>'<div class="row"><span>'+(i+1)+'. '+escapeHtml(n)+'</span><span>'+s+'</span></div>').join(''):'<div class="row"><span>No scores yet</span><span>—</span></div>';document.getElementById('leaderModal').classList.remove('hidden')}function escapeHtml(v){return v.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
c.addEventListener('pointerdown',e=>{pressed=true;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(k=>c.addEventListener(k,e=>{pressed=false;e.preventDefault()}));window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&document.activeElement.tagName!=='INPUT'){pressed=true;e.preventDefault()}if(e.code==='Enter'&&!document.getElementById('nameModal').classList.contains('hidden'))setName()});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'){pressed=false;e.preventDefault()}});window.addEventListener('blur',()=>pressed=false);
document.getElementById('start').onclick=reset;document.getElementById('playerBtn').onclick=showName;document.getElementById('nameGo').onclick=setName;document.getElementById('leaderBtn').onclick=showLeader;document.getElementById('leaderClose').onclick=()=>{document.getElementById('leaderModal').classList.add('hidden');reset()};
player=localStorage.getItem('unicornSkyLastPlayer')||'';u={x:125,y:250,vy:0,w:155,h:118};obs=[];score=0;lives=3;running=false;pressed=false;spawn=.7;inv=0;last=performance.now();if(player)document.getElementById('nameInput').value=player;requestAnimationFrame(loop);
})();
</script></body></html>
