<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Unicorn Sky</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#5d66d9;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center;padding:8px}main{width:min(1000px,100%);text-align:center}.home{color:#fff;text-decoration:none;font-weight:800;display:inline-block;padding:7px}canvas{display:block;width:100%;aspect-ratio:16/10;border:3px solid white;border-radius:16px;touch-action:none}.bar{display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap;padding:9px}button,select{min-height:44px;border:1px solid white;border-radius:9px;background:#6745b7;color:#fff;padding:7px 13px;font-size:16px;font-weight:800}.hint{font-size:13px;color:#e7e2ff}</style></head>
<body><main><a class="home" href="./">← Family Arcade</a><canvas id="g" width="960" height="600"></canvas><div class="bar"><button id="start">Start / Restart</button><select id="difficulty"><option value="0.72">Kid</option><option value="1" selected>Normal</option><option value="1.3">Fast</option></select><span id="status">🌈 Fly through rainbows!</span></div><div class="hint">Touch and hold, or hold Space, to fly up. Let go to float down. Avoid storm clouds and collect rainbows.</div></main>
<script>
(()=>{
const c=document.getElementById('g'),ctx=c.getContext('2d'),status=document.getElementById('status'),diff=document.getElementById('difficulty'),W=c.width,H=c.height;
let u,obs,score,lives,running,pressed,last,spawn,inv;
function reset(){u={x:125,y:250,vy:0,w:125,h:92};obs=[];score=0;lives=3;running=true;pressed=false;spawn=.7;inv=0;updateStatus()}
function updateStatus(){status.textContent=(lives?'❤️'.repeat(lives):'💔')+' Score: '+score}
function addObstacle(){const rainbow=Math.random()<.42;obs.push({type:rainbow?'rainbow':'cloud',x:W+100,y:65+Math.random()*(H-175),w:rainbow?90:130,h:rainbow?85:95,hit:false})}
function overlaps(a,b,p=0){return a.x+p<b.x+b.w&&a.x+a.w-p>b.x&&a.y+p<b.y+b.h&&a.y+a.h-p>b.y}
function update(dt){if(!running)return;const speed=+diff.value;inv=Math.max(0,inv-dt);u.vy+=(pressed?-720:510)*dt;u.vy=Math.max(-340,Math.min(340,u.vy));u.y+=u.vy*dt;if(u.y<8){u.y=8;u.vy=20}if(u.y+u.h>H-8){u.y=H-u.h-8;u.vy=-80}spawn-=dt;if(spawn<=0){addObstacle();spawn=(.95+Math.random()*.55)/speed}for(const o of obs){o.x-=235*speed*dt;const hb={x:u.x+25,y:u.y+17,w:u.w-43,h:u.h-30};if(!o.hit&&overlaps(hb,o,o.type==='cloud'?24:8)){o.hit=true;if(o.type==='rainbow')score+=10;else if(inv<=0){lives--;inv=1.3;if(lives<=0)running=false}updateStatus()}}obs=obs.filter(o=>o.x>-170)}
function cloud(o){ctx.save();ctx.translate(o.x,o.y);ctx.globalAlpha=o.hit?.25:1;const g=ctx.createLinearGradient(0,0,0,90);g.addColorStop(0,'#777995');g.addColorStop(1,'#3b3d58');ctx.fillStyle=g;ctx.beginPath();ctx.arc(30,50,27,0,Math.PI*2);ctx.arc(57,32,34,0,Math.PI*2);ctx.arc(88,30,40,0,Math.PI*2);ctx.arc(112,51,27,0,Math.PI*2);ctx.rect(30,45,82,33);ctx.fill();if(!o.hit){ctx.fillStyle='#ffd84c';ctx.beginPath();ctx.moveTo(62,57);ctx.lineTo(47,84);ctx.lineTo(64,82);ctx.lineTo(52,114);ctx.lineTo(84,75);ctx.lineTo(68,77);ctx.lineTo(79,57);ctx.closePath();ctx.fill();ctx.fillStyle='#65c8ff';[31,98,118].forEach((d,i)=>{ctx.beginPath();ctx.ellipse(d,92+(i%2)*8,4,10,-.2,0,Math.PI*2);ctx.fill()})}ctx.restore()}
function rainbow(o){if(o.hit)return;['#ff5e75','#ffb34f','#ffe65c','#63df79','#58baf2','#a97cf4'].forEach((color,i)=>{ctx.strokeStyle=color;ctx.lineWidth=8;ctx.beginPath();ctx.arc(o.x+45,o.y+61,44-i*6,Math.PI,Math.PI*2);ctx.stroke()})}
function unicorn(){ctx.save();if(inv&&Math.floor(inv*10)%2===0)ctx.globalAlpha=.3;ctx.translate(u.x+u.w/2,u.y+u.h/2);ctx.rotate(Math.max(-.16,Math.min(.16,u.vy/1200)));ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='96px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.fillText('🦄',0,2);ctx.restore()}
function draw(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#5299f4');sky.addColorStop(.55,'#9a82e8');sky.addColorStop(1,'#f4a9d4');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(const o of obs)o.type==='cloud'?cloud(o):rainbow(o);unicorn();ctx.fillStyle='rgba(40,30,90,.55)';ctx.fillRect(15,15,220,52);ctx.fillStyle='#fff';ctx.font='bold 26px Arial';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText((lives?'❤️'.repeat(lives):'💔')+'   '+score,30,49);if(!running){ctx.fillStyle='rgba(39,27,91,.58)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 58px Arial';ctx.fillText(lives?'UNICORN SKY':'GAME OVER',W/2,H/2-20);ctx.font='25px Arial';ctx.fillText('Tap Start / Restart',W/2,H/2+30)}}
function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{pressed=true;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(k=>c.addEventListener(k,e=>{pressed=false;e.preventDefault()}));
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){pressed=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'){pressed=false;e.preventDefault()}});window.addEventListener('blur',()=>pressed=false);
document.getElementById('start').addEventListener('click',reset);u={x:125,y:250,vy:0,w:125,h:92};obs=[];score=0;lives=3;running=false;pressed=false;spawn=.7;inv=0;last=performance.now();requestAnimationFrame(loop);
})();
</script></body></html>
