<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Unicorn Sky</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#5d66d9;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center;padding:8px}main{width:min(1000px,100%);text-align:center}.home{color:#fff;text-decoration:none;font-weight:800;display:inline-block;padding:7px}canvas{display:block;width:100%;aspect-ratio:16/10;border:3px solid white;border-radius:16px;touch-action:none}.bar{display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap;padding:9px}button,select{min-height:44px;border:1px solid white;border-radius:9px;background:#6745b7;color:white;padding:7px 13px;font-size:16px;font-weight:800}.hint{font-size:13px;color:#e7e2ff}</style></head><body><main><a class="home" href="./">← Family Arcade</a><canvas id="g" width="960" height="600"></canvas><div class="bar"><button id="start">Start / Restart</button><select id="difficulty"><option value="0.72">Kid</option><option value="1" selected>Normal</option><option value="1.3">Fast</option></select><span id="status">🌈 Fly through rainbows!</span></div><div class="hint">Touch and hold the sky to fly up. Let go to float down. Avoid storm clouds and collect rainbows.</div><script>(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),status=document.getElementById('status'),diff=document.getElementById('difficulty');const W=960,H=600;let uni,objects=[],score=0,lives=3,running=false,pressed=false,last=performance.now(),spawn=0,inv=0;function resetUni(){uni={x:150,y:H/2,vy:0,w:82,h:55}}function reset(){score=0;lives=3;objects=[];spawn=.5;inv=0;resetUni();running=true;status.textContent='❤️❤️❤️  Score: 0'}function addObject(){let rainbow=Math.random()<.42;objects.push({type:rainbow?'rainbow':'cloud',x:W+100,y:80+Math.random()*(H-180),w:rainbow?88:115,h:rainbow?80:65,hit:false})}function overlap(a,b,pad=0){return a.x+pad<b.x+b.w&&a.x+a.w-pad>b.x&&a.y+pad<b.y+b.h&&a.y+a.h-pad>b.y}function lose(){if(inv>0)return;lives--;inv=1.4;status.textContent='❤️'.repeat(lives)+' Score: '+score;if(lives<=0){running=false;status.textContent='Game over — Score: '+score}}function update(dt){if(!running)return;let m=Number(diff.value);inv=Math.max(0,inv-dt);uni.vy+=(pressed?-700:500)*dt;uni.vy=Math.max(-330,Math.min(330,uni.vy));uni.y+=uni.vy*dt;if(uni.y<5){uni.y=5;uni.vy=20}if(uni.y+uni.h>H-5){uni.y=H-uni.h-5;uni.vy=-80}spawn-=dt;if(spawn<=0){addObject();spawn=(.9+Math.random()*.55)/m}for(let o of objects){o.x-=235*m*dt;if(!o.hit&&overlap({x:uni.x+8,y:uni.y+7,w:uni.w-16,h:uni.h-14},o,o.type==='cloud'?18:8)){o.hit=true;if(o.type==='rainbow'){score+=10;status.textContent='❤️'.repeat(lives)+' Score: '+score}else lose()}}objects=objects.filter(o=>o.x>-160)}function cloud(o){x.fillStyle=o.hit?'rgba(85,77,120,.3)':'#6f6a94';x.beginPath();x.arc(o.x+30,o.y+37,28,0,7);x.arc(o.x+58,o.y+25,34,0,7);x.arc(o.x+88,o.y+38,27,0,7);x.fill();if(!o.hit){x.fillStyle='#3f3b61';x.fillRect(o.x+38,o.y+43,9,14);x.fillRect(o.x+75,o.y+43,9,14)}}function rainbow(o){if(o.hit)return;const cols=['#ff5e75','#ffb34f','#ffe65c','#63df79','#58baf2','#a97cf4'];cols.forEach((col,i)=>{x.strokeStyle=col;x.lineWidth=8;x.beginPath();x.arc(o.x+44,o.y+58,43-i*6,Math.PI,Math.PI*2);x.stroke()})}function unicorn(){x.save();if(inv>0&&Math.floor(inv*10)%2===0)x.globalAlpha=.35;x.translate(uni.x,uni.y);x.fillStyle='#fff';x.beginPath();x.ellipse(38,31,35,23,0,0,7);x.fill();x.beginPath();x.arc(67,20,18,0,7);x.fill();x.fillStyle='#f5a3dc';x.beginPath();x.moveTo(58,6);x.lineTo(63,-15);x.lineTo(72,7);x.fill();x.fillStyle='#ffd34d';x.beginPath();x.moveTo(70,2);x.lineTo(80,-23);x.lineTo(84,5);x.fill();x.fillStyle='#ae65db';x.beginPath();x.moveTo(7,25);x.quadraticCurveTo(-22,5,-25,38);x.quadraticCurveTo(-5,28,10,43);x.fill();x.fillStyle='#66d9ff';x.beginPath();x.moveTo(30,19);x.lineTo(5,1);x.lineTo(19,28);x.fill();x.fillStyle='#222';x.beginPath();x.arc(73,17,3,0,7);x.fill();x.restore()}function draw(){let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#5299f4');grad.addColorStop(.55,'#9a82e8');grad.addColorStop(1,'#f4a9d4');x.fillStyle=grad;x.fillRect(0,0,W,H);x.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<14;i++){let sx=(i*173)%W,sy=(i*97)%H;x.beginPath();x.arc(sx,sy,2+(i%3),0,7);x.fill()}for(let o of objects)o.type==='cloud'?cloud(o):rainbow(o);unicorn();x.fillStyle='rgba(40,30,90,.55)';x.fillRect(15,15,210,52);x.fillStyle='#fff';x.font='bold 26px Arial';x.textAlign='left';x.fillText('❤️'.repeat(lives)+'   '+score,30,49);if(!running){x.fillStyle='rgba(39,27,91,.6)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='bold 58px Arial';x.fillText('UNICORN SKY',W/2,H/2-20);x.font='25px Arial';x.fillText('Tap Start / Restart',W/2,H/2+30)}}function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{pressed=true;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(k=>c.addEventListener(k,e=>{pressed=false;e.preventDefault()}));addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){pressed=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='ArrowUp')pressed=false});document.getElementById('start').onclick=reset;resetUni();requestAnimationFrame(loop)})();</script></main></body></html>
