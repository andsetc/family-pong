<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#153c28"><title>Snake</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#10251b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overscroll-behavior:none}body{display:flex;justify-content:center;padding:8px}main{width:min(760px,100%);text-align:center}.home{color:#fff;text-decoration:none;font-weight:800;display:inline-block;padding:8px}h1{margin:2px 0 8px;letter-spacing:5px}canvas{display:block;width:min(92vw,620px);height:auto;aspect-ratio:1;margin:auto;border:4px solid #d9ffd9;border-radius:14px;background:#172d20;touch-action:none}.bar{display:flex;justify-content:center;gap:9px;align-items:center;flex-wrap:wrap;padding:10px}button,select{min-height:44px;border:1px solid #fff;border-radius:9px;background:#2c6b45;color:#fff;padding:7px 13px;font-size:16px;font-weight:800}.hint{font-size:13px;color:#cce6d3}.pad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:58px 58px;gap:7px;justify-content:center;margin:8px auto}.pad button{font-size:27px;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}@media(min-width:760px){.pad{display:none}}</style></head><body><main><a class="home" href="./">← Family Arcade</a><h1>SNAKE</h1><canvas id="game" width="600" height="600"></canvas><div class="bar"><button id="start">Start / Restart</button><select id="speed"><option value="180">Kid</option><option value="125" selected>Normal</option><option value="85">Fast</option></select><span id="status">Score: 0 • Best: 0</span></div><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="hint">Arrow keys or WASD • On iPad, swipe the board or use the buttons • Eat the apples, don't hit the wall or yourself.</div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),status=document.getElementById('status'),speed=document.getElementById('speed'),N=20,S=c.width/N,STORE='familySnakeBestV1';let snake,dir,nextDir,apple,score,best=+(localStorage.getItem(STORE)||0),running=false,timer=null,touch=null;function placeApple(){do{apple={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===apple.x&&p.y===apple.y))}function updateStatus(){status.textContent='Score: '+score+' • Best: '+best}function reset(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;running=true;placeApple();updateStatus();draw();timer=setInterval(step,+speed.value)}function setDir(nx,ny){if(nx===-dir.x&&ny===-dir.y)return;nextDir={x:nx,y:ny}}function step(){if(!running)return;dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return}snake.unshift(h);if(h.x===apple.x&&h.y===apple.y){score++;if(score>best){best=score;localStorage.setItem(STORE,best)}placeApple();updateStatus()}else snake.pop();draw()}function gameOver(){running=false;clearInterval(timer);draw();x.fillStyle='rgba(0,0,0,.62)';x.fillRect(0,0,c.width,c.height);x.textAlign='center';x.fillStyle='#fff';x.font='bold 58px Arial';x.fillText('GAME OVER',c.width/2,c.height/2-18);x.font='27px Arial';x.fillText('Score '+score+' • Best '+best,c.width/2,c.height/2+32);x.font='20px Arial';x.fillText('Tap Start / Restart',c.width/2,c.height/2+72)}function draw(){x.fillStyle='#172d20';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(255,255,255,.045)';x.lineWidth=1;for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}x.fillStyle='#ff4545';x.beginPath();x.arc(apple.x*S+S/2,apple.y*S+S/2,S*.34,0,Math.PI*2);x.fill();x.fillStyle='#78e08f';snake.forEach((p,i)=>{const m=i?4:2;x.beginPath();x.roundRect(p.x*S+m,p.y*S+m,S-m*2,S-m*2,7);x.fill()});const h=snake[0];x.fillStyle='#10251b';const eyes=dir.x?[[h.x*S+(dir.x>0?21:9),h.y*S+9],[h.x*S+(dir.x>0?21:9),h.y*S+21]]:[[h.x*S+9,h.y*S+(dir.y>0?21:9)],[h.x*S+21,h.y*S+(dir.y>0?21:9)]];eyes.forEach(e=>{x.beginPath();x.arc(e[0],e[1],2.6,0,Math.PI*2);x.fill()})}function key(e){const k=e.key.toLowerCase();if(['arrowup','w'].includes(k)){setDir(0,-1);e.preventDefault()}else if(['arrowdown','s'].includes(k)){setDir(0,1);e.preventDefault()}else if(['arrowleft','a'].includes(k)){setDir(-1,0);e.preventDefault()}else if(['arrowright','d'].includes(k)){setDir(1,0);e.preventDefault()}}window.addEventListener('keydown',key);document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{const d=b.dataset.dir;if(d==='up')setDir(0,-1);if(d==='down')setDir(0,1);if(d==='left')setDir(-1,0);if(d==='right')setDir(1,0);e.preventDefault()}));c.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};e.preventDefault()});c.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18){if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1)}touch=null;e.preventDefault()});document.getElementById('start').onclick=reset;speed.onchange=()=>{if(running){clearInterval(timer);timer=setInterval(step,+speed.value)}};snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=nextDir={x:1,y:0};apple={x:14,y:10};score=0;updateStatus();draw();x.fillStyle='rgba(0,0,0,.48)';x.fillRect(0,0,c.width,c.height);x.textAlign='center';x.fillStyle='#fff';x.font='bold 62px Arial';x.fillText('SNAKE',c.width/2,c.height/2-10);x.font='23px Arial';x.fillText('Tap Start / Restart',c.width/2,c.height/2+38)})();</script></main></body></html>
